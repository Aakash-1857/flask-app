<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{data[0]['title']}} | Movie Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background-color: #1c1c1e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 700px;
      width: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      
      height: 100%;
      object-fit: cover;
    }

    .content {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff;
    }

    .meta {
      font-size: 1rem;
      color: #cccccc;
      display: flex;
      gap: 20px;
    }

    .back-link {
      margin-top: 30px;
      align-self: flex-start;
      padding: 10px 20px;
      background-color: #007BFF;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-link:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .poster {
        height: 300px;
      }

      .title {
        font-size: 1.7rem;
      }

      .meta {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="{{data[0]['photo_url'][0]}}" alt="{{data[0]['title']}} Poster" class="poster">
    <div class="content">
      <h1 class="title">{{data[0]['title']}}</h1>
      <div class="meta">
        <span><strong>Year:</strong> {{data[0]['year']}}</span>
        <span><strong>Runtime:</strong> {{data[0]['runtime']}}</span>
      </div>
      <a href="/" class="back-link">← Back to Search</a>
    </div>
  </div>

</body>
</html>
